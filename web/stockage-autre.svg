<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Autre stockage">
  <!-- La destination « Autre stockage » n'est le service de personne : son type
       est choisi par l'administrateur parmi tous ceux qu'rclone sait gérer. Elle
       n'a donc pas de site, aucun logo à récupérer, et surtout aucun logo de
       fournisseur à emprunter — ce nuage neutre ne prétend représenter aucune
       marque, et c'est exactement ce qu'on lui demande.
       Blanc en dur, comme stockage-local.svg : chargé dans une balise <img>, un SVG
       externe n'hérite ni du thème ni de la couleur du texte de la page. -->
