<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Stockage local">
  <!-- Le stockage local est la destination locale de crabe : elle n'a pas de site, donc
       pas de logo à récupérer chez qui que ce soit. Ce gland est son icône, il
       vit dans le dépôt, et aucune requête ne sort jamais pour l'afficher.
       Blanc en dur : chargé dans une balise <img>, un SVG externe n'hérite ni du
       thème ni de la couleur du texte de la page. -->
  <path d="M12 1.4c.4 0 .8.3.8.8v1.3h-1.6V2.2c0-.5.4-.8.8-.8Z" fill="#ffffff"/>
  <path d="M12 3.4c4.2 0 7.6 2.2 7.6 4.9 0 .7-.6 1.2-1.2 1.2H5.6c-.7 0-1.2-.6-1.2-1.2C4.4 5.6 7.8 3.4 12 3.4Z" fill="#ffffff"/>
  <path d="M6.3 11h11.4c.3 0 .6.3.6.6 0 4.4-2.5 8.3-6 11.2-.2.2-.5.2-.7 0-3.5-2.9-6-6.8-6-11.2 0-.3.3-.6.7-.6Z" fill="#ffffff"/>
</svg>
